set_clock_face:
  name: Set clock face
  description: Show a native device face on one screen (Independent Display).
  target:
    device:
      integration: divoom_times_gate
  fields:
    screen:
      name: Screen
      description: Screen index 0-4 (left to right).
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 4
          mode: box
    clock_id:
      name: Face ID
      description: The Divoom face (ClockId), found in the Divoom app.
      required: true
      example: 182
      selector:
        number:
          min: 0
          mode: box

show_message:
  name: Show message
  description: Flash a text message on one screen for a few seconds, then revert.
  target:
    device:
      integration: divoom_times_gate
  fields:
    screen:
      name: Screen
      description: Screen index 0-4 (left to right).
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 4
          mode: box
    text:
      name: Text
      description: The message to display.
      required: true
      example: "Doorbell!"
      selector:
        text:
    duration:
      name: Duration
      description: Seconds to show the message before reverting.
      required: false
      example: 10
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: seconds
          mode: box
    color:
      name: Color
      description: Text colour as #RRGGBB.
      required: false
      example: "#FF0000"
      selector:
        text:

show_image:
  name: Show image
  description: Show a photo or animated GIF on one screen (from a local path or URL). With duration 0 it stays until the next refresh/config change.
  target:
    device:
      integration: divoom_times_gate
  fields:
    screen:
      name: Screen
      description: Screen index 0-4 (left to right).
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 4
          mode: box
    image_path:
      name: Image path
      description: Local file path (e.g. /config/www/photo.jpg). Use this or image_url.
      example: /config/www/photo.jpg
      selector:
        text:
    image_url:
      name: Image URL
      description: HTTP(S) URL of the image/GIF. Use this or image_path.
      example: https://example.com/photo.jpg
      selector:
        text:
    fit:
      name: Fit
      description: cover = fill the square (center-crop), contain = letterbox on black.
      default: cover
      selector:
        select:
          options:
            - cover
            - contain
    duration:
      name: Duration
      description: Seconds before reverting to the screen's normal content. 0 = keep showing.
      default: 0
      selector:
        number:
          min: 0
          max: 86400
          mode: box
